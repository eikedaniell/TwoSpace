<html lang="pt-BR"><head><meta charset="utf-8">

<title>Espaço a Dois</title>
<style>

</style></head><body>
<canvas id="c"></canvas>

<div id="invp" class="hidden"><h4>Com a outra pessoa</h4><div class="grid"><button id="b-hug"><span>🤗</span>Abraço<small>1</small></button><button id="b-kiss"><span>💋</span>Beijo<small>2</small></button><button id="b-lead"><span>🤝</span>Guiar<small>3</small></button><button id="b-follow"><span>🙋</span>Seguir<small>4</small></button><button id="b-lap"><span>😴</span>Deitar no colo<small>5</small></button></div><h4>Poses</h4><div class="grid"><button id="b-sit"><span>🪑</span>Sentar<small>6</small></button><button id="b-lie"><span>🛌</span>Dormir<small>7</small></button><button id="b-back"><span>🌤</span>Barriga pra cima<small>8</small></button><button id="b-crawl"><span>🐛</span>Rastejar<small>9</small></button></div><h4></h4><div class="grid" style="grid-template-columns:1fr"><button id="b-none"><span>✖</span>Soltar / levantar<small>0</small></button></div></div>
