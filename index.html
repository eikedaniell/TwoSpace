<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espaço a Dois</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#2a2447;--fg:#fff}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;touch-action:none}
#st{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;text-align:center;font-size:14px;text-shadow:0 1px 4px #000a;pointer-events:none}
#help{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));left:10px;font-size:12px;line-height:1.5;background:#0005;padding:6px 10px;border-radius:10px;pointer-events:none}
#bar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:15px;border:0;border-radius:22px;padding:10px 16px;background:#ffffffd9;color:#2a2447;cursor:pointer}
button.on{background:#ff6f9c;color:#fff}
#lobby{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#2a2447,#7a3f78 60%,#e58fb4)}
.box{display:flex;flex-direction:column;gap:10px;width:min(320px,86vw);text-align:center}
.box h2{margin:0 0 6px}.box input{font:inherit;font-size:16px;padding:12px 14px;border:0;border-radius:14px;background:#fffffff0;color:#2a2447}
.row{display:flex;gap:8px}.row button{flex:1}.ghost{background:transparent;color:#fff;text-decoration:underline}
#msg{min-height:20px;font-size:13px}
#chat{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom,0px));left:10px;width:min(260px,46vw);display:flex;flex-direction:column;gap:6px}
@media(max-width:700px){#chat{bottom:calc(112px + env(safe-area-inset-bottom,0px))}}
#log{max-height:150px;overflow-y:auto;font-size:13px;background:#0005;border-radius:10px;padding:6px 8px}#log:empty{display:none}
.m{margin:2px 0;word-break:break-word}#chat .row{gap:6px}#ci{flex:1;min-width:0;border:0;border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;background:#fffffff0;color:#2a2447}#cs{padding:8px 12px;flex:0 0 auto}
.col{display:flex;flex-direction:column;gap:10px}.hidden{display:none!important}
#rn{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:20px;min-width:0;width:100%}
#code{font-size:56px;font-weight:700;letter-spacing:10px;color:#ffd166}
</style></head><body>
<canvas id="c"></canvas>
<div id="lobby"><div class="box"><h2>💞 Espaço a Dois</h2>
<div id="menu" class="col"><button id="mk">Criar sala</button><div>ou entre numa sala existente</div>
<div class="row"><input id="rn" maxlength="4" placeholder="CÓDIGO" aria-label="Código da sala" autocomplete="off"><button id="jn">Entrar</button></div></div>
<div id="wait" class="col hidden"><div>Passe este código para a outra pessoa:</div><div id="code">----</div><div>Esperando alguém entrar…</div></div>
<div id="msg"></div><button id="solo" class="ghost">Jogar sozinho</button></div></div>
<div id="st"></div>
<div id="help">Toque/clique para andar · ou use W A S D / setas</div>
<div id="chat"><div id="log"></div><div class="row"><input id="ci" maxlength="120" placeholder="Mensagem (C ou Enter)" autocomplete="off"><button id="cs">➤</button></div></div>
<div id="bar">
<button id="b-hug">🤗 Abraço (H)</button><button id="b-kiss">💋 Beijo (K)</button>
<button id="b-lead">🤝 Guiar (G)</button><button id="b-follow">🙋 Seguir (F)</button><button id="b-none">✖ Soltar (X)</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),st=document.getElementById('st');
const W=1800,H=1100,ZM=1.6,SKIN='#ffdfc4',cols=[0xff7aa8,0x6aa7ff,0xffb84d,0x8f7aff,0x3ccf9a];
const hex=n=>'#'+(n>>>0).toString(16).padStart(6,'0');
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const flowers=Array.from({length:260},()=>({x:rnd()*W,y:rnd()*H,c:['#fff','#ffd6e7','#fff3a8'][rnd()*3|0]}));
const trees=Array.from({length:34},()=>({x:60+rnd()*(W-120),y:60+rnd()*(H-120),s:.8+rnd()*.7,c:rnd()<.3?'#e58fb4':'#4faa7a'}))
 .filter(t=>Math.hypot(t.x-W/2,t.y-H/2)>260&&Math.hypot(t.x-1300,t.y-300)>190);
const flies=Array.from({length:24},(_,i)=>({x:rnd()*W,y:rnd()*H,p:i}));
const me={x:W/2+(Math.random()-.5)*200,y:H/2+60,fx:1,dx:0,dy:1,act:'none',c:cols[Math.random()*cols.length|0],mv:false,tx:null,ty:null};
let conn=null,remote=null,remObj=null,roomName="",net=false,hosting=false,keys={},hearts=[],heartT=0,lastSend=0,lastJson='',camx=0,camy=0,vw=0,vh=0,dpr=1;
const $=id=>document.getElementById(id),msg=$('msg');
const PREF='espacoadois-sala-',CFG={config:{iceServers:['stun.l.google.com','stun1.l.google.com','stun2.l.google.com'].map(h=>({urls:'stun:'+h+':19302'}))}};
const rcode=()=>{const l='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:4},()=>l[Math.random()*l.length|0]).join('')};
let peer=null;
function setupConn(c){c.on('open',()=>{conn=c;lastJson='';$('lobby').style.display='none'});
 c.on('data',d=>{if(d&&typeof d.chat==='string'){const t=d.chat.slice(0,120);addMsg('Parceiro(a)',t);peerSay={t,until:performance.now()+6000};return}
 if(d&&d.full){msg.textContent='Sala cheia (só 2 pessoas).';$('lobby').style.display='flex';conn=null;net=false;return}if(d&&typeof d.x==='number')remote=d});
 c.on('close',()=>{conn=null;remote=null});c.on('error',()=>{})}
function create(t=0){if(typeof Peer==='undefined'){msg.textContent='PeerJS não carregou. Verifique a internet.';return}
 if(peer)peer.destroy();net=true;hosting=true;const cod=rcode();roomName=cod;peer=new Peer(PREF+cod,CFG);
 peer.on('open',()=>{$('code').textContent=cod;$('menu').classList.add('hidden');$('wait').classList.remove('hidden');msg.textContent=''});
 peer.on('error',e=>{if(e.type==='unavailable-id'&&t<5)return create(t+1);net=false;msg.textContent='Erro ao criar sala: '+e.type});
 peer.on('connection',c=>{if(conn&&conn.open){c.on('open',()=>{c.send({full:1});setTimeout(()=>c.close(),300)});return}setupConn(c)})}
function join(){if(typeof Peer==='undefined'){msg.textContent='PeerJS não carregou. Verifique a internet.';return}
 const cod=$('rn').value.trim().toUpperCase();if(cod.length!==4){msg.textContent='Digite o código de 4 letras.';return}
 if(peer)peer.destroy();net=true;hosting=false;msg.textContent='Conectando…';peer=new Peer(CFG);
 peer.on('error',e=>{net=false;msg.textContent=e.type==='peer-unavailable'?'Sala não encontrada. Confira o código.':'Erro de conexão ('+e.type+').'});
 peer.on('open',()=>{setupConn(peer.connect(PREF+cod));setTimeout(()=>{if(!conn&&net)msg.textContent='Não conectou. Confira o código ou desative AdBlock/VPN.'},10000)})}
$('mk').onclick=()=>create();$('jn').onclick=join;$('rn').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
$('solo').onclick=()=>{$('lobby').style.display='none'};
const q=new URLSearchParams(location.search).get('sala');if(q)$('rn').value=q.slice(0,4).toUpperCase();
let peerSay=null;
function addMsg(who,t){const d=document.createElement('div'),b=document.createElement('b');d.className='m';b.textContent=who+': ';d.append(b,document.createTextNode(t));const l=$('log');l.append(d);l.scrollTop=1e9;while(l.children.length>50)l.firstChild.remove()}
function sendChat(){const t=$('ci').value.trim().slice(0,120);if(!t)return;$('ci').value='';if(conn&&conn.open)try{conn.send({chat:t})}catch(e){}addMsg('Você',t);me.say={t,until:performance.now()+6000}}
$('cs').onclick=sendChat;$('ci').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){sendChat();$('ci').blur()}if(e.key==='Escape')$('ci').blur()});
function rs(){dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';vw=innerWidth/ZM;vh=innerHeight/ZM}
addEventListener('resize',rs);rs();
const IDS=['hug','kiss','lead','follow','none'];
function setAct(a){me.act=me.act===a?'none':a;IDS.forEach(k=>document.getElementById('b-'+k).classList.toggle('on',me.act===k&&k!=='none'))}
IDS.forEach(k=>document.getElementById('b-'+k).onclick=()=>setAct(k));
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if((e.code==='Enter'||e.code==='KeyC')&&$('lobby').style.display==='none'){e.preventDefault();$('ci').focus();return}keys[e.code]=1;const k=e.code;
 if(k==='KeyH')setAct('hug');if(k==='KeyK')setAct('kiss');if(k==='KeyG')setAct('lead');if(k==='KeyF')setAct('follow');if(k==='KeyX')me.act!=='none'&&setAct(me.act)});
addEventListener('keyup',e=>keys[e.code]=0);
cv.addEventListener('pointerdown',e=>{if(document.activeElement&&document.activeElement.tagName==='INPUT'){document.activeElement.blur();return}me.tx=camx+e.clientX/ZM;me.ty=camy+e.clientY/ZM});
function partner(){if(!remote){remObj=null;return null}
 if(!remObj)remObj={x:remote.x,y:remote.y};const r=remObj,d=remote;r.s=d;r.act=d.act;r.c=+d.c||0x6aa7ff;r.fx=d.fx;r.dx=d.dx;r.dy=d.dy;r.mv=d.mv;r.say=peerSay;return r}
function pairing(P){if(!P||Math.hypot(P.x-me.x,P.y-me.y)>400)return null;const a=me.act,b=P.act;
 if((a==='hug'||a==='kiss')&&a===b)return a;if((a==='follow'&&b==='lead')||(a==='lead'&&b==='follow'))return'hold';return null}
function hands(c,o,pk,t){const bob=c.mv?Math.sin(t*10)*2:0;let L={x:c.x-15,y:c.y-16+bob},R={x:c.x+15,y:c.y-16-bob};
 if(c.act==='hug'){if(pk==='hug'){const u=Math.sign(o.x-c.x)||1,B={x:o.x+u*13,y:o.y-24};L={x:B.x,y:B.y-3};R={x:B.x,y:B.y+3}}else{L={x:c.x-32,y:c.y-30};R={x:c.x+32,y:c.y-30}}}
 else if(c.act==='kiss'){if(pk==='kiss'){L={x:o.x-8,y:o.y-40};R={x:o.x+8,y:o.y-40}}else{L={x:c.x-7,y:c.y-26};R={x:c.x+7,y:c.y-26}}}
 else if(c.act==='lead'||c.act==='follow'){if(pk==='hold'){const M={x:(c.x+o.x)/2,y:(c.y+o.y)/2-16};if(o.x>=c.x)R=M;else L=M}
  else{const h={x:c.x+c.fx*30,y:c.y-22};if(c.fx>0)R=h;else L=h}}
 return{L,R}}
function drawChar(c,o,pk,t){const col=hex(c.c),h=hands(c,o||c,pk,t),mv=c.mv&&!pk||(c.mv&&c.act==='lead'),sw=mv?Math.sin(t*10)*4:0;
 ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(c.x,c.y+2,15,5,0,0,7);ctx.fill();
 ctx.strokeStyle='#5a4a63';ctx.lineWidth=4;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(c.x-5,c.y-7);ctx.lineTo(c.x-5+sw,c.y);ctx.moveTo(c.x+5,c.y-7);ctx.lineTo(c.x+5-sw,c.y);ctx.stroke();
 ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(c.x-12,c.y-32,24,26,8);ctx.fill();
 ctx.strokeStyle=col;ctx.lineWidth=5;
 [[c.x-10,h.L],[c.x+10,h.R]].forEach(([sx,p])=>{ctx.beginPath();ctx.moveTo(sx,c.y-26);ctx.lineTo(p.x,p.y);ctx.stroke()});
 ctx.fillStyle=SKIN;[h.L,h.R].forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4.5,0,7);ctx.fill()});
 const lean=pk==='kiss'?Math.sign((o?o.x:c.x)-c.x)*5:0,hx=c.x+lean,hy=c.y-42;
 ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(hx,hy,11,0,7);ctx.fill();
 ctx.fillStyle='#4a3350';ctx.beginPath();ctx.arc(hx,hy-1,11.5,Math.PI,0);ctx.fill();
 ctx.fillStyle='#222';[-4,4].forEach(e=>{ctx.beginPath();ctx.arc(hx+e+c.fx*2,hy+1,1.6,0,7);ctx.fill()});
 ctx.strokeStyle='#c0506f';ctx.lineWidth=1.3;ctx.beginPath();
 if(pk==='kiss')ctx.arc(hx+c.fx*3,hy+6,1.8,0,7);else ctx.arc(hx+c.fx*2,hy+4,3,.2,Math.PI-.2);ctx.stroke();
 if(c.say&&performance.now()<c.say.until){ctx.font='11px system-ui,sans-serif';const ls=[];let cur='';for(const w of c.say.t.split(' ')){const n=cur?cur+' '+w:w;if(ctx.measureText(n).width>130&&cur){ls.push(cur);cur=w}else cur=n}ls.push(cur);ls.length=Math.min(ls.length,4);
  const bw=Math.max(...ls.map(l=>ctx.measureText(l).width))+14,bh=ls.length*14+8,bx=c.x-bw/2,by=c.y-62-bh;ctx.fillStyle='#fffffff0';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,8);ctx.fill();ctx.fillStyle='#2a2447';ls.forEach((l,i)=>ctx.fillText(l,bx+7,by+14+i*14))}}
function tree(t){ctx.fillStyle='#8a6a55';ctx.fillRect(t.x-5*t.s,t.y-22*t.s,10*t.s,22*t.s);
 ctx.fillStyle=t.c;ctx.beginPath();ctx.arc(t.x,t.y-38*t.s,26*t.s,0,7);ctx.arc(t.x-14*t.s,t.y-28*t.s,16*t.s,0,7);ctx.arc(t.x+14*t.s,t.y-28*t.s,16*t.s,0,7);ctx.fill()}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.1);last=now;const t=now/1000,k=1-Math.exp(-12*dt);
 const P=partner();
 if(P){P.x+=(P.s.x-P.x)*k;P.y+=(P.s.y-P.y)*k}
 const pk=pairing(P),locked=pk==='hug'||pk==='kiss'||(pk==='hold'&&me.act==='follow');
 if(!locked){let vx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),vy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(vx||vy)me.tx=me.ty=null;else if(me.tx!=null){const ex=me.tx-me.x,ey=me.ty-me.y,d=Math.hypot(ex,ey);if(d<6)me.tx=me.ty=null;else{vx=ex/d;vy=ey/d}}
  const l=Math.hypot(vx,vy);me.mv=l>0;
  if(l){vx/=l;vy/=l;me.x+=vx*140*dt;me.y+=vy*140*dt;me.dx=vx;me.dy=vy;if(Math.abs(vx)>.2)me.fx=Math.sign(vx)}}
 else{me.tx=me.ty=null;let tx,ty;me.mv=false;
  if(pk==='hold'){tx=P.x-P.dy*-34*-1;tx=P.x+(-P.dy)*34-P.dx*8;ty=P.y+P.dx*34-P.dy*8;me.fx=P.fx;me.dx=P.dx;me.dy=P.dy}
  else{const D=pk==='hug'?32:22,ex=P.x-me.x,ey=P.y-me.y,d=Math.hypot(ex,ey)||1;tx=(me.x+P.x)/2-ex/d*D/2;ty=(me.y+P.y)/2-ey/d*D/2;me.fx=Math.sign(ex)||1}
  const dd=Math.hypot(tx-me.x,ty-me.y);me.mv=pk==='hold'&&dd>4;me.x+=(tx-me.x)*Math.min(1,5*dt);me.y+=(ty-me.y)*Math.min(1,5*dt)}
 me.x=Math.max(20,Math.min(W-20,me.x));me.y=Math.max(40,Math.min(H-10,me.y));
 camx=Math.max(0,Math.min(W-vw,me.x-vw/2));camy=Math.max(0,Math.min(H-vh,me.y-vh/2));if(vw>W)camx=(W-vw)/2;if(vh>H)camy=(H-vh)/2;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#2a2447';ctx.fillRect(0,0,innerWidth,innerHeight);
 ctx.setTransform(dpr*ZM,0,0,dpr*ZM,-camx*dpr*ZM,-camy*dpr*ZM);
 for(let i=0;i<18;i++)for(let j=0;j<11;j++){ctx.fillStyle=(i+j)%2?'#8fd3a5':'#86cc9d';ctx.fillRect(i*100,j*100,100,100)}
 ctx.strokeStyle='#e8cfa4';ctx.lineWidth=46;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(80,980);ctx.quadraticCurveTo(700,500,1100,620);ctx.quadraticCurveTo(1500,720,1720,150);ctx.stroke();
 ctx.fillStyle='#7cc3e8';ctx.beginPath();ctx.ellipse(1300,300,150,90,0,0,7);ctx.fill();ctx.strokeStyle='#bfe6f7';ctx.lineWidth=4;ctx.stroke();
 flowers.forEach(f=>{ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,3,0,7);ctx.fill()});
 const items=trees.map(tr=>({y:tr.y,f:()=>tree(tr)}));
 items.push({y:me.y,f:()=>drawChar(me,P,pk,t)});if(P)items.push({y:P.y,f:()=>drawChar(P,me,pk,t)});
 items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
 if(me.tx!=null){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(me.tx,me.ty,8+Math.sin(t*6)*2,0,7);ctx.stroke()}
 flies.forEach(f=>{ctx.fillStyle='rgba(255,243,168,'+(.5+.5*Math.sin(t*2+f.p))+')';ctx.beginPath();ctx.arc(f.x+Math.sin(t*.5+f.p)*30,f.y+Math.cos(t*.4+f.p)*20,2.5,0,7);ctx.fill()});
 if(pk&&(heartT+=dt)>.6){heartT=0;hearts.push({x:(me.x+P.x)/2+(Math.random()-.5)*14,y:Math.min(me.y,P.y)-60,a:0})}
 ctx.font='18px serif';hearts=hearts.filter(h=>(h.a+=dt)<1.8);hearts.forEach(h=>{ctx.globalAlpha=1-h.a/1.8;ctx.fillText('💗',h.x,h.y-h.a*30)});ctx.globalAlpha=1;
 if(conn&&conn.open&&now-lastSend>70){const o={x:Math.round(me.x),y:Math.round(me.y),fx:me.fx,dx:+me.dx.toFixed(2),dy:+me.dy.toFixed(2),act:me.act,c:me.c,mv:me.mv},j=JSON.stringify(o);
  if(j!==lastJson){lastJson=j;lastSend=now;try{conn.send(o)}catch(e){}}}
 let s;if(!net)s='Modo solo — jogando sozinho.';
 else if(!P)s=hosting?'Sala '+roomName+' — passe este código para a outra pessoa 💌':'Conexão encerrada. Recarregue a página para entrar de novo.';
 else if(P.act!=='none'&&me.act==='none')s={hug:'💗 Querem te abraçar! Aperte H',kiss:'💗 Querem te beijar! Aperte K',lead:'💗 Querem te guiar pela mão! Aperte F',follow:'💗 Querem seguir você! Aperte G'}[P.act];
 else if(pk==='hold')s=me.act==='lead'?'Você está guiando — ande à vontade 💫':'Você está sendo guiado(a) pela mão 💫';
 else if(pk)s='💗';else if(me.act!=='none')s='Esperando a outra pessoa aceitar…';else s='Conectados — vocês dois estão no jardim ✨';
 if(st.textContent!==s)st.textContent=s}
requestAnimationFrame(loop);
</script></body></html>
